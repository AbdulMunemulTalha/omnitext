# Runs Quicky behind Caddy, which gets and renews the HTTPS certificate
# automatically. Point the domain's DNS A record at this server first.
services:
  quicky:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - quicky-data:/app/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    command: caddy reverse-proxy --from ${DOMAIN:-heyquicky.com} --to quicky:3000
    volumes:
      - caddy-data:/data
    depends_on:
      - quicky

volumes:
  quicky-data:
  caddy-data:

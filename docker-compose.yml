# Runs OmniText behind Caddy, which gets and renews the HTTPS certificate
# automatically. Point the domain's DNS A record at this server first.
services:
  omnitext:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - omnitext-data:/app/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    command: caddy reverse-proxy --from ${DOMAIN:-creatorsstory.com} --to omnitext:3000
    volumes:
      - caddy-data:/data
    depends_on:
      - omnitext

volumes:
  omnitext-data:
  caddy-data:
